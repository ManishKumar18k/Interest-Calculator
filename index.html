
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interest Calculator</title>

<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ManishKumar18k/Interest-Calculator/main/Glossy%20Rupee%20Investment%20Growth%20Icon.png">

<link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <div class="calculator">

            <div class="icon">₹</div>

            <h1>Interest Calculator</h1>
            <p class="subtitle">Calculate your interest & total amount</p>

            <div class="input-box">
                <label>Principal Amount</label>
                <div class="input-field">
                    <span>₹</span>
                    <input type="number" id="principal" placeholder="Enter amount">
                </div>
            </div>

            <div class="input-box">
                <label>Monthly Rate (per ₹100)</label>
                <div class="input-field">
                    <span>%</span>
                    <input type="number" id="rate" placeholder="Enter rate">
                </div>
            </div>

            <div class="input-box">
                <label>Start Date</label>
                <div class="input-field">
                    <input type="date" id="startDate">
                </div>
            </div>

            <div class="input-box">
                <label>End Date</label>
                <div class="input-field">
                    <input type="date" id="endDate">
                </div>
            </div>

            <button onclick="calculateInterest()">Calculate Interest →</button>

            <div id="result" class="result">
                <p>Your result will appear here</p>
            </div>

            <div class="footer">
                Simple Interest Calculator • Made with ❤️
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
